<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BACTERIA WAR</title>
<link rel="stylesheet" href="/css/style.css?v=30">
</head>
<body>
<div id="app">
  <!-- 로그인 -->
  <div id="loginScreen" class="screen active">
    <div class="login-box">
      <div class="brand">BACTERIA<b>WAR</b></div>
      <p class="tagline">지도 위 영토 생태계 · 도전으로 점령</p>
      <input id="usernameInput" type="text" placeholder="닉네임 (2자 이상)" maxlength="24">
      <button id="loginBtn" class="btn primary">입장</button>
      <div id="loginError" class="err"></div>
    </div>
  </div>

  <!-- 매크로 지도 -->
  <div id="macroScreen" class="screen">
    <div class="topbar">
      <div class="brand sm">BACTERIA<b>WAR</b></div>
      <div class="wallet">
        <span class="tribe-badge" id="tribeBadge">―</span>
        <span>⚡<b id="energy">0</b><span class="dim income-rate" id="incomeRate"></span></span>
        <span class="harvest-chip hidden" id="harvestChip">🧺<b>0</b></span>
        <span class="glory-chip" id="gloryChip" title="현재 인생 누적 노력. 사망 시 영웅 확률.">🏆<b id="glory">0</b><span class="dim" id="heroProb">(0%)</span></span>
        <span class="hero-chip hidden" id="heroChip">👑영웅</span>
        <span class="dim" id="record">0승 0패</span>
      </div>
    </div>
    <canvas id="mapCanvas"></canvas>
    <div class="maphint">탭: <b>빈 땅 점유</b> · 적 영역 탭: <b>도전</b> · 금색 링: <b>약탈 가능</b></div>
    <div class="activity-ticker" id="activityTicker"></div>
    <div class="tut-banner hidden" id="tutBanner">
      <span class="tut-text" id="tutText"></span>
      <button class="tut-close" id="tutClose" title="닫기">✕</button>
    </div>
    <div class="zoom-ctrl">
      <button id="zoomIn" class="zoom-btn">＋</button>
      <button id="zoomOut" class="zoom-btn">−</button>
      <button id="zoomMe" class="zoom-btn" title="내 위치로">◎</button>
      <button id="zoomMyCells" class="zoom-btn" title="내 영토로 (반복 탭: 순환)">🏰</button>
      <button id="lbBtn" class="zoom-btn" title="영토 순위">🏆</button>
      <button id="questBtn" class="zoom-btn" title="오늘의 퀘스트">📜<span class="q-dot hidden" id="questDot"></span></button>
    </div>
    <div class="eco-bar" id="ecoBar"></div>

    <!-- 액션 시트 -->
    <div class="sheet" id="sheet"><div id="sheetBody"></div></div>
  </div>

  <!-- 마이크로 전투 -->
  <div id="battleScreen" class="screen">
    <canvas id="battleCanvas"></canvas>
    <div class="stakebar" id="stakeBar"></div>
    <div class="bhud">
      <div class="side me"><div class="lbl">YOU</div><div class="val" id="meE">0</div></div>
      <div class="side mid"><div class="btimer" id="bTimer">2:00</div><div class="bcount even" id="bCount">● 1 vs 1</div></div>
      <div class="side en"><div class="lbl">ENEMY</div><div class="val" id="enE">0</div></div>
    </div>
    <div class="bctrl">
      <div class="modehint" id="modeHint">
        빈 곳 탭: 돌 두기 (바깥⚡15·중간⚡25·안쪽⚡40, 안쪽일수록 생산↑) · 내 돌 드래그: 선택 → 적 탭: 집중공격
      </div>
      <div class="placebtns">
        <button class="btn ghost" id="clearSel">선택 해제</button>
        <button class="btn ghost" id="muteBtn" title="소리 켜기/끄기">🔊</button>
        <button class="btn ghost danger-text" id="forfeitBtn">항복</button>
      </div>
    </div>
    <div class="countdown" id="countdown"></div>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle"></h2><p id="ovDesc"></p>
      <button class="btn primary" id="ovBack">맵으로</button>
    </div>
  </div>
</div>

<!-- 방어 도전 알림 모달 -->
<div class="challenge-modal" id="challengeModal">
  <div class="cm-box">
    <div class="cm-icon">⚔️</div>
    <div class="cm-text" id="cmText"></div>
    <div class="cm-count" id="cmCount"></div>
    <div class="btnrow">
      <button class="btn ghost" id="cmDecline">자동방어(AI)</button>
      <button class="btn primary" id="cmAccept">직접 방어!</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="/js/app.js?v=30"></script>
</body>
</html>
